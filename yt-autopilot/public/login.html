<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — YT AutoPilot</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="login-wrap">
      <form class="login-card" id="login-form">
        <div class="brand">
          <span class="brand-mark">▶</span>
          <div>
            <h1>YT AutoPilot</h1>
            <p>Sign in to continue</p>
          </div>
        </div>
        <label class="field">
          <span>Dashboard password</span>
          <input id="password" type="password" autocomplete="current-password" autofocus required />
        </label>
        <button class="btn btn-primary" type="submit">Sign in</button>
        <p id="err" class="result result-error hidden"></p>
      </form>
    </div>
    <script>
      document.getElementById("login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const err = document.getElementById("err");
        err.classList.add("hidden");
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ password: document.getElementById("password").value }),
        });
        if (response.ok) {
          window.location.href = "/";
          return;
        }
        const data = await response.json().catch(() => ({}));
        err.textContent = data.error || "Sign in fail hua.";
        err.classList.remove("hidden");
      });
    </script>
  </body>
</html>
